name: Build AB Z Fruit APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare private signing key
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -z "$KS_PASS" ]; then
            echo "::warning::Secret KS_PASS not set: building with the older shared test key."
            exit 0
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in app/signing.enc -out app/ab-test.keystore -pass env:KS_PASS
      - name: Build debug (installable) and release (unsigned)
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: gradle --no-daemon assembleDebug assembleRelease
      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/ABZFruit-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk out/ABZFruit-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ABZFruit-APK
          path: out/*.apk
      - name: Publish test APK as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "test-build-${{ github.run_number }}" out/ABZFruit-debug.apk \
            --title "AB Z Fruit test build ${{ github.run_number }}" \
            --notes "Installable test APK signed with the private AB test key (installs over the previous build). For testing only." \
            --prerelease
