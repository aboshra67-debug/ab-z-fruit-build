name: Build AB Z Fruit APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug (installable) and release (unsigned)
        run: gradle --no-daemon assembleDebug assembleRelease
      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/ABZFruit-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk out/ABZFruit-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ABZFruit-APK
          path: out/*.apk
