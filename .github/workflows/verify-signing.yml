name: Verify signing certificate
on:
  push:
    branches: [verify-vc137-signing-20261125]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify certificate
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          set -eu
          test -n "$KS_PASS" || { echo 'KS_PASS unavailable'; exit 1; }
          umask 077
          f=$(mktemp)
          trap 'rm -f "$f"' EXIT
          for opts in '-pbkdf2' '-md sha256' '-md md5'; do
            if openssl enc -d -aes-256-cbc $opts -in app/signing.enc -out "$f" -pass env:KS_PASS 2>/dev/null && keytool -exportcert -alias abzfruit -keystore "$f" -storepass:env KS_PASS > "$f.cert" 2>/dev/null; then
              sha256sum "$f.cert"
              rm -f "$f.cert"
              exit 0
            fi
            rm -f "$f.cert"
          done
          echo 'Unable to verify certificate with attempted formats'
          exit 1
