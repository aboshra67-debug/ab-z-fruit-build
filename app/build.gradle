plugins {
    id 'com.android.application'
}

android {
    namespace 'com.absoftware.zfruit'
    compileSdk 34

    defaultConfig {
        applicationId "com.absoftware.zfruit"
        minSdk 24
        targetSdk 34
        // every CI build gets a higher versionCode, so each APK installs over the previous one
        def runNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionCode 165
        versionName "1.7.2"
    }

    signingConfigs {
        // private test key: stored encrypted in the repo (app/signing.enc); CI decrypts it with the KS_PASS secret.
        // The same key on every build lets each APK install over the previous one.
        // Without the secret it falls back to the older shared test key (app/test-debug.keystore).
        debug {
            def ks = file('ab-test.keystore')
            def pw = System.getenv('KS_PASS')
            if (ks.exists() && pw) {
                storeFile ks
                storePassword pw
                keyAlias 'abzfruit'
                keyPassword pw
            } else {
                storeFile file('test-debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            // the whole HTML5 game lives in ../www and is packed as Android assets
            assets.srcDirs = ['../www']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
