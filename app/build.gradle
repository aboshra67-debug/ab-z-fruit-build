plugins {
    id 'com.android.application'
}

android {
    namespace 'com.absoftware.zfruit'
    compileSdk 34

    defaultConfig {
        applicationId "com.absoftware.zfruit"
        minSdk 24
        targetSdk 34
        // every CI build gets a higher versionCode, so each APK installs over the previous one
        def runNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionCode 100 + runNo
        versionName "1.0.${runNo}"
    }

    signingConfigs {
        // fixed test key (same on every build) so updates install over the old version without uninstalling
        debug {
            storeFile file('test-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            // the whole HTML5 game lives in ../www and is packed as Android assets
            assets.srcDirs = ['../www']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
