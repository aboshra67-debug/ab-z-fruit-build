plugins {
    id 'com.android.application'
}

android {
    namespace 'com.absoftware.zfruit'
    compileSdk 34

    defaultConfig {
        applicationId "com.absoftware.zfruit"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            // the whole HTML5 game lives in ../www and is packed as Android assets
            assets.srcDirs = ['../www']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
